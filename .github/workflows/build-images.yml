name: Build production images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-images.yml"
      - "apps/**"
      - "packages/**"
      - "skills/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".dockerignore"

permissions:
  contents: read
  packages: write

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/loomic-server:latest
            ghcr.io/${{ github.repository_owner }}/loomic-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          provenance: false

  web:
    name: Web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public build variables
        env:
          SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_BASE_URL }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SERVER_URL" || { echo "Missing repository variable NEXT_PUBLIC_SERVER_BASE_URL"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "Missing repository variable NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Missing repository variable NEXT_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SERVER_BASE_URL=${{ vars.NEXT_PUBLIC_SERVER_BASE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/loomic-web:latest
            ghcr.io/${{ github.repository_owner }}/loomic-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: false
